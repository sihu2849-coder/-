<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 계산기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .calculator {
            background-color: #202124;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 80px;
            background-color: #202124;
            border: none;
            color: #ffffff;
            font-size: 2.5rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.25rem;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background-color: #3c4043;
            color: #ffffff;
            transition: background-color 0.1s;
            aspect-ratio: 1;
        }
        button:active {
            background-color: #5f6368;
        }
        button.operator {
            background-color: #fbbc04;
            color: #202124;
        }
        button.operator:active {
            background-color: #e3a803;
        }
        button.clear {
            background-color: #dadce0;
            color: #202124;
        }
        button.clear:active {
            background-color: #bdc1c6;
        }
        button.equal {
            background-color: #1a73e8;
            color: #ffffff;
        }
        button.equal:active {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        <button class="operator" onclick="appendOperator('*')">×</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="equal" style="grid-row: span 2; height: 100%; border-radius: 25px;" onclick="calculate()">=</button>
        
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        
        <button onclick="appendNumber('0')" style="grid-column: span 2; border-radius: 25px; aspect-ratio: auto;">0</button>
        <button onclick="appendNumber('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let shouldResetDisplay = false;

    function appendNumber(number) {
        if (display.value === '0' || shouldResetDisplay) {
            display.value = number;
            shouldResetDisplay = false;
        } else {
            display.value += number;
        }
    }

    function appendOperator(operator) {
        const lastChar = display.value.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar)) {
            display.value = display.value.slice(0, -1) + operator;
        } else {
            display.value += operator;
        }
        shouldResetDisplay = false;
    }

    function clearDisplay() {
        display.value = '0';
    }

    function calculate() {
        try {
            // eval을 안전하게 처리하기 위해 연산자 규칙 검증 후 실행
            let result = eval(display.value);
            // 소수점 스크롤 오류 방지 (15자리 제한)
            display.value = Number(result.toPrecision(15)).toString();
            shouldResetDisplay = true;
        } catch (error) {
            display.value = '오류';
            shouldResetDisplay = true;
        }
    }
</script>

</body>
</html>
